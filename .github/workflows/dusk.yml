name: Dusk Tests

on:
  push:
  pull_request:

jobs:
  dusk:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: db
          MARIADB_ROOT_PASSWORD: admin
          MARIADB_USER: admin
          MARIADB_PASSWORD: admin
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      senhaunica-faker:
        image: uspdev/senhaunica-faker
        env:
          APP_URL: http://127.0.0.1:3141
        ports:
          - 3141:3141

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, dom, pdo, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy env from example
        run: cp .env.example .env

      - name: Remove Dusk visual variables
        run: |
          sed -i -E '/^(APP_URL|DUSK_DRIVER_URL|DUSK_START_MAXIMIZED|DUSK_HEADLESS_DISABLED|SENHAUNICA_DEV)=/d' .env
          sed -i '/DUSK_START_MAXIMIZED/d' .env || true
          sed -i '/DUSK_HEADLESS_DISABLED/d' .env || true

      - name: Configure .env file for testing
        run: |
          echo "APP_URL=http://127.0.0.1:47800" >> .env
          echo "DUSK_DRIVER_URL=http://localhost:9515" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=db" >> .env
          echo "DB_USERNAME=admin" >> .env
          echo "DB_PASSWORD=admin" >> .env
          echo "SENHAUNICA_DEV=http://127.0.0.1:3141/wsusuario/oauth" >> .env

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 --silent && break
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Start Laravel server and run Dusk
        run: |
          php artisan serve --host=127.0.0.1 --port=47800 > /tmp/laravel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:47800/ > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/laravel.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:47800/ > /dev/null; then
            cat /tmp/laravel.log
            exit 1
          fi

          php artisan dusk --without-tty